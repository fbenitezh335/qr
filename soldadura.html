<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial;
}

/* HERO */
.hero {
    height: 100vh;
    position: relative;
}

.hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* TÍTULO ARRIBA */
.title {
    position: absolute;
    top: 40px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 24px;
    font-weight: bold;

    text-shadow: 0px 2px 6px rgba(0,0,0,0.8);
}

/* FLECHAS */
.arrow {
    position: absolute;
    top: 50%;
    font-size: 30px;
    color: white;
    background: rgba(0,0,0,0.5);
    padding: 10px;
}

.left { left: 10px; }
.right { right: 10px; }

/* INDICACIÓN BAJAR */
.hint-down {
    position: absolute;
    bottom: 100px; /* MÁS ARRIBA */
    width: 100%;
    text-align: center;
    color: white;
    font-size: 16px;
    animation: fade 2s infinite;
}

@keyframes fade {
    0% {opacity: 0.3;}
    50% {opacity: 1;}
    100% {opacity: 0.3;}
}

/* CONTENIDO */
.content {
    padding: 20px;
}
</style>
</head>

<body>

<div class="hero">
    <img src="soldadura.jpg">

    <div class="title">SOLDADURA Y CALDERERIA</div>

    <div class="arrow left" onclick="goPrev()">❮</div>
    <div class="arrow right" onclick="goNext()">❯</div>

    <div class="hint-down">Desliza ↓</div>
</div>

<div class="content">
    <h2>Trabajos de Soldadura y Calderería</h2>
    <p>Aquí puedes añadir fotos y trabajos reales.</p>
</div>

<script>
function goPrev() {
    window.location.href = "mecanica.html";
}

function goNext() {
    window.location.href = "hidraulica.html";
}

/* SWIPE */
let startX = 0;

window.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

window.addEventListener("touchend", e => {
    let endX = e.changedTouches[0].clientX;

    if(startX - endX > 50) goNext();
    if(startX - endX < -50) goPrev();
});
</script>

</body>
</html>
