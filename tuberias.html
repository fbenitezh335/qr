<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial;
}

/* HERO */
.hero {
    height: 100vh;
    position: relative;
}

.hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* FLECHAS */
.arrow {
    position: absolute;
    top: 50%;
    font-size: 30px;
    color: white;
    background: rgba(0,0,0,0.5);
    padding: 10px;
}

.left { left: 10px; }
.right { right: 10px; }

/* INDICACIONES */
.hint-down {
    position: absolute;
    bottom: 40px;
    width: 100%;
    text-align: center;
    color: white;
    animation: blink 1.5s infinite;
}

/* CONTENIDO */
.content {
    padding: 20px;
}

@keyframes blink {
    0% {opacity: 0;}
    50% {opacity: 1;}
    100% {opacity: 0;}
}
</style>
</head>

<body>

<div class="hero">
    <img src="tuberias.jpg">

    <div class="arrow left" onclick="goPrev()">❮</div>
    <div class="arrow right" onclick="goNext()">❯</div>

    <div class="hint-down">Desliza ↓</div>
</div>

<div class="content">
    <h2>TRABAJOS DE TUBERIA</h2>
    <p>Aquí metes contenido real (fotos, etc)</p>
</div>

<script>
function goPrev() {
    window.location.href = "index.html";
}

function goNext() {
    window.location.href = "index.html";
}

/* SWIPE */
let startX = 0;

window.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

window.addEventListener("touchend", e => {
    let endX = e.changedTouches[0].clientX;
    let diff = startX - endX;

    if(diff > 50) goNext();
    if(diff < -50) goPrev();
});
</script>

</body>
</html>
