<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Francisco Sánchez - Servicios Navales</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.container {
    height: 100vh;
    width: 100%;
    position: relative;
}

/* SECCIONES */
.section {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    transition: transform 0.6s ease;
}

/* IMÁGENES */
.section img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* TEXTO */
.title {
    position: absolute;
    bottom: 80px;
    left: 20px;
    color: white;
    font-size: 28px;
    font-weight: bold;
}

/* FLECHAS */
.arrow {
    position: fixed;
    right: 20px;
    font-size: 30px;
    color: white;
    background: rgba(0,0,0,0.5);
    padding: 10px;
    cursor: pointer;
    z-index: 10;
    user-select: none;
}

.up { top: 40%; }
.down { top: 55%; }
</style>
</head>

<body>

<div class="container">

    <div class="section">
        <img src="inicio.jpg">
    </div>

    <div class="section">
        <img src="mecanica.jpg">
        <div class="title">Mecánica Naval</div>
    </div>

    <div class="section">
        <img src="soldadura.jpg">
        <div class="title">Soldadura y Calderería</div>
    </div>

    <div class="section">
        <img src="hidraulica.jpg">
        <div class="title">Hidráulica</div>
    </div>

    <div class="section">
        <img src="tuberias.jpg">
        <div class="title">Tuberías</div>
    </div>

</div>

<div class="arrow up" onclick="scrollUp()">▲</div>
<div class="arrow down" onclick="scrollDown()">▼</div>

<script>
const sections = document.querySelectorAll(".section");
let index = 0;
let isScrolling = false;

function updateView() {
    sections.forEach((sec, i) => {
        sec.style.transform = `translateY(${(i - index) * 100}%)`;
    });
}

updateView();

// SCROLL CON RATÓN
window.addEventListener("wheel", (e) => {
    if (isScrolling) return;

    isScrolling = true;

    if (e.deltaY > 0) index++;
    else index--;

    if (index < 0) index = 0;
    if (index > sections.length - 1) index = sections.length - 1;

    updateView();

    setTimeout(() => isScrolling = false, 700);
});

// TOUCH (MÓVIL)
let startY = 0;

window.addEventListener("touchstart", e => {
    startY = e.touches[0].clientY;
});

window.addEventListener("touchend", e => {
    let endY = e.changedTouches[0].clientY;
    let diff = startY - endY;

    if (Math.abs(diff) > 50) {
        if (diff > 0) index++;
        else index--;

        if (index < 0) index = 0;
        if (index > sections.length - 1) index = sections.length - 1;

        updateView();
    }
});
</script>

</body>
</html>
