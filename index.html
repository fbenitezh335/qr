<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    overflow: hidden;
}

/* CONTENEDOR PRINCIPAL */
.container {
    height: 100vh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
}

/* CADA PANTALLA */
.section {
    height: 100vh;
    scroll-snap-align: start;
    position: relative;
}

/* IMÁGENES */
.section img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* TEXTO */
.title {
    position: absolute;
    bottom: 80px;
    left: 20px;
    color: white;
    font-size: 28px;
}

/* BOTÓN */
.btn {
    position: absolute;
    bottom: 30px;
    left: 20px;
    background: rgba(0,0,0,0.6);
    padding: 10px 20px;
    color: white;
    text-decoration: none;
}

/* FLECHAS */
.arrow {
    position: fixed;
    right: 20px;
    font-size: 30px;
    color: white;
    background: rgba(0,0,0,0.5);
    padding: 10px;
    cursor: pointer;
    z-index: 10;
}

.up { top: 40%; }
.down { top: 55%; }
</style>
</head>

<body>

<div class="container" id="container">

    <div class="section">
        <img src="inicio.jpg">
    </div>

    <div class="section">
        <img src="mecanica.jpg">
        <div class="title">Mecánica Naval</div>
    </div>

    <div class="section">
        <img src="soldadura.jpg">
        <div class="title">Soldadura y Calderería</div>
    </div>

    <div class="section">
        <img src="hidraulica.jpg">
        <div class="title">Hidráulica</div>
    </div>

    <div class="section">
        <img src="tuberias.jpg">
        <div class="title">Tuberías</div>
    </div>

</div>

<div class="arrow up" onclick="scrollUp()">▲</div>
<div class="arrow down" onclick="scrollDown()">▼</div>

<script>
const container = document.getElementById("container");
let index = 0;

function scrollDown() {
    index++;
    container.scrollTo({
        top: index * window.innerHeight,
        behavior: "smooth"
    });
}

function scrollUp() {
    index--;
    if(index < 0) index = 0;
    container.scrollTo({
        top: index * window.innerHeight,
        behavior: "smooth"
    });
}
</script>

</body>
</html>
