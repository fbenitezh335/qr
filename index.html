<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    overflow: hidden;
}

.screen {
    width: 100%;
    height: 100vh;
    position: relative;
}

.screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* TEXTO NAVEGA */
.hint {
    position: absolute;
    bottom: 60px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 18px;
    animation: fade 2s infinite;
}

/* FLECHA FINA */
.arrow-line {
    display: inline-block;
    margin-left: 10px;
    border: solid white;
    border-width: 0 2px 2px 0;
    padding: 5px;
    transform: rotate(-45deg);
}

/* ANIMACIÓN SUAVE */
@keyframes fade {
    0% {opacity: 0.3;}
    50% {opacity: 1;}
    100% {opacity: 0.3;}
}

/* BOTÓN FLECHA */
.arrow {
    position: absolute;
    top: 50%;
    right: 10px;
    font-size: 30px;
    color: white;
    background: rgba(0,0,0,0.5);
    padding: 10px;
}
</style>
</head>

<body>

<div class="screen">
    <img src="inicio.jpg">

    <div class="hint">
        Navega <span class="arrow-line"></span>
    </div>

    <div class="arrow" onclick="goNext()">❯</div>
</div>

<script>
function goNext() {
    window.location.href = "mecanica.html";
}

let startX = 0;

window.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

window.addEventListener("touchend", e => {
    let endX = e.changedTouches[0].clientX;
    if(startX - endX > 50) goNext();
});
</script>

</body>
</html>
