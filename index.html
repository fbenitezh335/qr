<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Servicios Navales</title>

<style>
body {
    margin: 0;
    overflow: hidden;
}

.container {
    display: flex;
    width: 500%;
    height: 100vh;
    transition: transform 0.4s ease;
}

.slide {
    width: 100%;
    height: 100%;
    position: relative;
}

.slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* BOTÓN */
.link {
    position: absolute;
    bottom: 40px;
    left: 20px;
    background: rgba(0,0,0,0.6);
    padding: 12px 20px;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

/* FLECHAS */
.arrow {
    position: fixed;
    top: 50%;
    font-size: 30px;
    color: white;
    background: rgba(0,0,0,0.5);
    padding: 10px;
    cursor: pointer;
}

.left { left: 10px; }
.right { right: 10px; }
</style>
</head>

<body>

<div class="container" id="slider">

    <div class="slide"><img src="inicio.jpg"></div>

    <div class="slide">
        <img src="mecanica.jpg">
        <a href="mecanica.html" class="link">Ver trabajos</a>
    </div>

    <div class="slide">
        <img src="soldadura.html">
        <a href="soldadura.html" class="link">Ver trabajos</a>
    </div>

    <div class="slide">
        <img src="hidraulica.jpg">
        <a href="hidraulica.html" class="link">Ver trabajos</a>
    </div>

    <div class="slide">
        <img src="tuberias.jpg">
        <a href="tuberias.html" class="link">Ver trabajos</a>
    </div>

</div>

<div class="arrow left" onclick="prev()">❮</div>
<div class="arrow right" onclick="next()">❯</div>

<script>
let index = 0;
const slider = document.getElementById("slider");

function update() {
    slider.style.transform = `translateX(-${index * 100}%)`;
}

function next() {
    index++;
    if(index > 4) index = 4;
    update();
}

function prev() {
    index--;
    if(index < 0) index = 0;
    update();
}

/* SWIPE */
let startX = 0;

window.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

window.addEventListener("touchend", e => {
    let endX = e.changedTouches[0].clientX;
    let diff = startX - endX;

    if(Math.abs(diff) > 50) {
        if(diff > 0) next();
        else prev();
    }
});
</script>

</body>
</html>
