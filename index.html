<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Servicios Navales</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    height: 100vh;
    position: relative;
}

/* SECCIONES */
.section {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    transition: transform 0.6s ease;
}

/* IMÁGENES */
.section img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* TEXTO */
.title {
    position: absolute;
    bottom: 80px;
    left: 20px;
    color: white;
    font-size: 28px;
    font-weight: bold;
}

/* FLECHAS */
.arrow {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    font-size: 30px;
    color: white;
    background: rgba(0,0,0,0.5);
    padding: 10px;
    cursor: pointer;
    z-index: 10;
}

.left { left: 10px; }
.right { right: 10px; }
</style>
</head>

<body>

<div class="container">

    <div class="section"><img src="inicio.jpg"></div>

    <div class="section">
        <img src="mecanica.jpg">
        <div class="title">Mecánica Naval</div>
    </div>

    <div class="section">
        <img src="soldadura.jpg">
        <div class="title">Soldadura y Calderería</div>
    </div>

    <div class="section">
        <img src="hidraulica.jpg">
        <div class="title">Hidráulica</div>
    </div>

    <div class="section">
        <img src="tuberias.jpg">
        <div class="title">Tuberías</div>
    </div>

</div>

<div class="arrow left" onclick="prev()">❮</div>
<div class="arrow right" onclick="next()">❯</div>

<script>
const sections = document.querySelectorAll(".section");
let index = 0;
let isMoving = false;

function updateView() {
    sections.forEach((sec, i) => {
        sec.style.transform = `translateX(${(i - index) * 100}%)`;
    });
}

updateView();

/* BOTONES */
function next() {
    if (isMoving) return;
    isMoving = true;

    index++;
    if (index > sections.length - 1) index = sections.length - 1;

    updateView();
    setTimeout(() => isMoving = false, 600);
}

function prev() {
    if (isMoving) return;
    isMoving = true;

    index--;
    if (index < 0) index = 0;

    updateView();
    setTimeout(() => isMoving = false, 600);
}

/* SWIPE MÓVIL */
let startX = 0;

window.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

window.addEventListener("touchend", e => {
    let endX = e.changedTouches[0].clientX;
    let diff = startX - endX;

    if (Math.abs(diff) > 50) {
        if (diff > 0) next();
        else prev();
    }
});
</script>

</body>
</html>
